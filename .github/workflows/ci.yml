name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (iOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project GlassStore.xcodeproj \
            -scheme GlassStore \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test | xcbeautify || xcodebuild -project GlassStore.xcodeproj -scheme GlassStore -destination 'platform=iOS Simulator,name=iPhone 17' test
